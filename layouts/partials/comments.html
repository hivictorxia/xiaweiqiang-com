<div class="author-section">
    <!-- 左侧：有颜色的色块与文字 -->
    <div class="author-content">
        <h2>Say hi.</h2>
        <p>我是夏卫强，专注价值投资、商业分析与人生设计。在有限的世界里，玩一场无限的游戏。</p>
        <div class="author-links">
            <a href="mailto:你的邮箱@example.com">Email</a> · 
            <a href="/about/">了解更多</a>
        </div>
    </div>
    
    <!-- 右侧：填满同等大小的照片 -->
    <div class="author-avatar">
        <img src="/images/avatar.jpg" alt="夏卫强">
    </div>
</div>




<!-- 👇 全新设计：底部极简卡片式文章导航 -->
<div class="custom-paginav">
    <!-- 左侧：较新的文章 -->
    {{ if .PrevInSection }}
    <a class="nav-card prev-card" href="{{ .PrevInSection.Permalink }}">
        <span class="nav-label">← 较新文章</span>
        <span class="nav-title">{{ .PrevInSection.Title }}</span>
    </a>
    {{ else }}
    <div class="nav-card empty-card"></div>
    {{ end }}

    <!-- 右侧：较旧的文章 -->
    {{ if .NextInSection }}
    <a class="nav-card next-card" href="{{ .NextInSection.Permalink }}">
        <span class="nav-label">较旧文章 →</span>
        <span class="nav-title">{{ .NextInSection.Title }}</span>
    </a>
    {{ else }}
    <div class="nav-card empty-card"></div>
    {{ end }}
</div>
